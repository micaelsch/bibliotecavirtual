<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha estante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin:0; background:#1c2321; font-family:'Ubuntu', -apple-system, sans-serif; padding:2.5rem; }
        h1 { font-family:Georgia, 'Iowan Old Style', serif; color:#efe3c8; margin:0 0 20px; }
        .topo { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
        .topo-esquerda { display:flex; gap:10px; align-items:center; }
        button { font-family:'Ubuntu', sans-serif; padding:8px 14px; border-radius:3px; border:none; background:#a8763a; color:#faf6ea; font-weight:500; cursor:pointer; transition:background 0.2s ease; }
        button:hover { background:#8f6530; }

        .dropdown { position:relative; }
        .dropdown-toggle { background:#efe3c8; color:#211c16; border:1px solid #c2b28a; font-weight:400; }
        .dropdown-toggle:hover { background:#efe3c8; filter:brightness(0.95); }
        .dropdown-lista { display:none; position:absolute; top:100%; left:0; z-index:10; min-width:180px; border:1px solid #c2b28a; border-radius:3px; overflow:hidden; margin-top:2px; box-shadow:0 4px 10px rgba(0,0,0,0.3); max-height:240px; overflow-y:auto; }
        .dropdown-opcao { padding:8px 10px; color:#faf6ea; cursor:pointer; font-family:'Ubuntu', sans-serif; }
        .dropdown-opcao:hover { filter:brightness(1.15); }

        .grade { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:26px; margin-top:14px; }
        .livro { position:relative; background:#efe3c8; border-radius:3px; padding:18px 16px 16px 20px; transition:transform 0.2s ease; cursor:pointer; box-shadow:2px 3px 8px rgba(0,0,0,0.35); border-top:5px solid #6b4a30; border-bottom:5px solid #6b4a30; }
        .livro:hover { transform:translateY(-4px) rotate(-0.4deg); }
        .livro::before { content:''; position:absolute; left:0; top:0; bottom:0; width:9px; background:var(--genre, #a8916a); box-shadow:inset -2px 0 3px rgba(0,0,0,0.25); }
        .livro::after { content:''; position:absolute; right:-4px; top:3px; bottom:3px; width:5px; border-radius:0 3px 3px 0; background:repeating-linear-gradient(to bottom, #ddd0ae 0px, #ddd0ae 1.5px, #c2b28a 1.5px, #c2b28a 3px); box-shadow:1px 0 0 #a8996f; }
        .livro h3 { display:inline-block; transform-origin:left center; transition:transform 0.2s ease; font-family:Georgia, 'Iowan Old Style', serif; font-size:16.5px; color:#211c16; margin:0 0 6px; }
        .livro:hover h3 { transform:scale(1.06); }
        .livro p { font-size:12.5px; color:#5c5346; margin:0; font-family:'Ubuntu', sans-serif; }
    </style>
</head>
<body>

<h1>Minha estante</h1>

<div class="topo">
    <div class="topo-esquerda">
        <button id="btn-adicionar">Adicionar livro</button>
        <div class="dropdown" id="dropdown-filtro">
            <button type="button" class="dropdown-toggle" id="filtro-toggle">Todas as categorias</button>
            <div class="dropdown-lista" id="filtro-lista"></div>
        </div>
    </div>
    <button id="btn-sair">Sair</button>
</div>

<div class="grade" id="grade-livros"></div>

<script>
    const email = sessionStorage.getItem('email');
    const senha = sessionStorage.getItem('senha');
    const credenciais = btoa(email + ':' + senha);

    const coresCategorias = {
        'Romance': '#c97b84', 'Terror': '#8c2f2f', 'Fantasia': '#6a4c93',
        'Ficção científica': '#2f7a7a', 'Mistério': '#4b5566', 'Suspense': '#b5651d',
        'Ação e aventura': '#c77d2e', 'Drama': '#6b3a4b', 'Histórico': '#7a5230',
        'Desenvolvimento pessoal': '#5c7a5c'
    };

    async function carregarCategorias() {
        const resposta = await fetch('http://localhost:8080/categorias', { headers: { 'Authorization': 'Basic ' + credenciais } });
        const categorias = await resposta.json();
        const lista = document.getElementById('filtro-lista');

        const todas = document.createElement('div');
        todas.className = 'dropdown-opcao';
        todas.textContent = 'Todas as categorias';
        todas.style.backgroundColor = '#5c5346';
        todas.addEventListener('click', function () {
            document.getElementById('filtro-toggle').textContent = 'Todas as categorias';
            document.getElementById('filtro-toggle').style.backgroundColor = '#efe3c8';
            document.getElementById('filtro-toggle').style.color = '#211c16';
            lista.style.display = 'none';
            carregarLivros();
        });
        lista.appendChild(todas);

        categorias.forEach(categoria => {
            const cor = coresCategorias[categoria.nome] || '#a8916a';
            const opcao = document.createElement('div');
            opcao.className = 'dropdown-opcao';
            opcao.textContent = categoria.nome;
            opcao.style.backgroundColor = cor;

            opcao.addEventListener('click', function () {
                const toggle = document.getElementById('filtro-toggle');
                toggle.textContent = categoria.nome;
                toggle.style.backgroundColor = cor;
                toggle.style.color = '#faf6ea';
                lista.style.display = 'none';
                carregarLivros(categoria.id);
            });

            lista.appendChild(opcao);
        });
    }

    document.getElementById('filtro-toggle').addEventListener('click', function () {
        const lista = document.getElementById('filtro-lista');
        lista.style.display = lista.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', function (evento) {
        if (!document.getElementById('dropdown-filtro').contains(evento.target)) {
            document.getElementById('filtro-lista').style.display = 'none';
        }
    });

    async function carregarLivros(categoriaId) {
        let url = 'http://localhost:8080/livros';
        if (categoriaId) url += '?categoriaId=' + categoriaId;
        const resposta = await fetch(url, { headers: { 'Authorization': 'Basic ' + credenciais } });
        const livros = await resposta.json();
        const grade = document.getElementById('grade-livros');
        grade.innerHTML = '';
        livros.forEach(livro => {
            const cor = coresCategorias[livro.categoria?.nome] || '#a8916a';
            const card = document.createElement('div');
            card.className = 'livro';
            card.style.setProperty('--genre', cor);
            card.innerHTML = `<h3>${livro.titulo}</h3><p>${livro.autor}</p>`;
            grade.appendChild(card);
        });
    }

    document.getElementById('btn-adicionar').addEventListener('click', () => window.location.href = 'adicionar-livro.html');
    document.getElementById('btn-sair').addEventListener('click', () => { sessionStorage.clear(); window.location.href = 'login.html'; });

    carregarCategorias();
    carregarLivros();
</script>

</body>
</html>
