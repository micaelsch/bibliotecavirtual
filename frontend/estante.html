<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha estante</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; }
        .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
        .livro { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
        .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    </style>
</head>
<body>

<h1>Minha estante</h1>

<div class="topo">
    <div>
        <button id="btn-adicionar">Adicionar livro</button>
        <select id="filtro-categoria"><option value="">Todas as categorias</option></select>
    </div>
    <button id="btn-sair">Sair</button>
</div>

<div class="grade" id="grade-livros"></div>

<script>
    const email = sessionStorage.getItem('email');
    const senha = sessionStorage.getItem('senha');
    const credenciais = btoa(email + ':' + senha);

    async function carregarCategorias() {
        const resposta = await fetch('http://localhost:8080/categorias', {
            headers: { 'Authorization': 'Basic ' + credenciais }
        });
        const categorias = await resposta.json();

        const select = document.getElementById('filtro-categoria');
        categorias.forEach(categoria => {
            const opcao = document.createElement('option');
            opcao.value = categoria.id;
            opcao.textContent = categoria.nome;
            select.appendChild(opcao);
        });
    }

    async function carregarLivros(categoriaId) {
        let url = 'http://localhost:8080/livros';
        if (categoriaId) url += '?categoriaId=' + categoriaId;

        const resposta = await fetch(url, {
            headers: { 'Authorization': 'Basic ' + credenciais }
        });
        const livros = await resposta.json();

        const grade = document.getElementById('grade-livros');
        grade.innerHTML = '';

        livros.forEach(livro => {
            const card = document.createElement('div');
            card.className = 'livro';
            card.innerHTML = `<h3>${livro.titulo}</h3><p>${livro.autor}</p>`;
            grade.appendChild(card);
        });
    }

    document.getElementById('btn-adicionar').addEventListener('click', function () {
        window.location.href = 'adicionar-livro.html';
    });

    document.getElementById('filtro-categoria').addEventListener('change', function () {
        carregarLivros(this.value);
    });

    document.getElementById('btn-sair').addEventListener('click', function () {
        sessionStorage.clear();
        window.location.href = 'login.html';
    });

    carregarCategorias();
    carregarLivros();
</script>

</body>
</html>
