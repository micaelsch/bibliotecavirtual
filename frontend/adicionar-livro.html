<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar livro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#1c2321; font-family:'Ubuntu', -apple-system, sans-serif; }
        .caixa { background:#efe3c8; padding:32px; border-radius:3px; border-top:5px solid #6b4a30; border-bottom:5px solid #6b4a30; box-shadow:2px 3px 10px rgba(0,0,0,0.4); width:300px; }
        h1 { font-family:Georgia, 'Iowan Old Style', serif; color:#211c16; margin:0 0 20px; font-size:22px; }
        label { display:block; margin-top:14px; font-size:13px; color:#5c5346; }
        input { width:100%; padding:8px; margin-top:4px; border:1px solid #c2b28a; border-radius:3px; background:#faf6ea; box-sizing:border-box; font-family:'Ubuntu', sans-serif; }
        button[type="submit"] { width:100%; margin-top:22px; padding:10px; background:#a8763a; color:#faf6ea; border:none; border-radius:3px; font-family:'Ubuntu', sans-serif; font-weight:500; cursor:pointer; transition:background 0.2s ease; }
        button[type="submit"]:hover { background:#8f6530; }

        .dropdown { position:relative; margin-top:4px; }
        .dropdown-toggle { width:100%; text-align:left; padding:8px; border:1px solid #c2b28a; border-radius:3px; background:#faf6ea; font-family:'Ubuntu', sans-serif; cursor:pointer; color:#211c16; }
        .dropdown-lista { display:none; position:absolute; top:100%; left:0; right:0; z-index:10; border:1px solid #c2b28a; border-radius:3px; overflow:hidden; margin-top:2px; box-shadow:0 4px 10px rgba(0,0,0,0.3); max-height:220px; overflow-y:auto; }
        .dropdown-opcao { padding:8px 10px; color:#faf6ea; font-family:'Ubuntu', sans-serif; cursor:pointer; }
        .dropdown-opcao:hover { filter:brightness(1.15); }
    </style>
</head>
<body>

<div class="caixa">
    <h1>Adicionar livro</h1>
    <form id="form-livro">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>
        <label for="autor">Autor</label>
        <input type="text" id="autor" required>

        <label>Categoria</label>
        <div class="dropdown" id="dropdown-categoria">
            <button type="button" class="dropdown-toggle" id="dropdown-toggle">Selecione uma categoria</button>
            <div class="dropdown-lista" id="dropdown-lista"></div>
        </div>

        <button type="submit">Salvar</button>
    </form>
</div>

<script>
    const email = sessionStorage.getItem('email');
    const senha = sessionStorage.getItem('senha');
    const credenciais = btoa(email + ':' + senha);
    let categoriaSelecionada = null;

    const coresCategorias = {
        'Romance': '#c97b84', 'Terror': '#8c2f2f', 'Fantasia': '#6a4c93',
        'Ficção científica': '#2f7a7a', 'Mistério': '#4b5566', 'Suspense': '#b5651d',
        'Ação e aventura': '#c77d2e', 'Drama': '#6b3a4b', 'Histórico': '#7a5230',
        'Desenvolvimento pessoal': '#5c7a5c'
    };

    async function carregarCategorias() {
        const resposta = await fetch('http://localhost:8080/categorias', { headers: { 'Authorization': 'Basic ' + credenciais } });
        const categorias = await resposta.json();
        const lista = document.getElementById('dropdown-lista');

        categorias.forEach(categoria => {
            const cor = coresCategorias[categoria.nome] || '#a8916a';
            const opcao = document.createElement('div');
            opcao.className = 'dropdown-opcao';
            opcao.textContent = categoria.nome;
            opcao.style.backgroundColor = cor;

            opcao.addEventListener('click', function () {
                categoriaSelecionada = categoria.id;
                const toggle = document.getElementById('dropdown-toggle');
                toggle.textContent = categoria.nome;
                toggle.style.backgroundColor = cor;
                toggle.style.color = '#faf6ea';
                lista.style.display = 'none';
            });

            lista.appendChild(opcao);
        });
    }

    document.getElementById('dropdown-toggle').addEventListener('click', function () {
        const lista = document.getElementById('dropdown-lista');
        lista.style.display = lista.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', function (evento) {
        if (!document.getElementById('dropdown-categoria').contains(evento.target)) {
            document.getElementById('dropdown-lista').style.display = 'none';
        }
    });

    document.getElementById('form-livro').addEventListener('submit', async function (evento) {
        evento.preventDefault();

        if (!categoriaSelecionada) {
            alert('Selecione uma categoria.');
            return;
        }

        const livro = {
            titulo: document.getElementById('titulo').value,
            autor: document.getElementById('autor').value,
            categoria: { id: categoriaSelecionada }
        };

        const resposta = await fetch('http://localhost:8080/livros', {
            method: 'POST',
            headers: { 'Authorization': 'Basic ' + credenciais, 'Content-Type': 'application/json' },
            body: JSON.stringify(livro)
        });

        if (resposta.ok) window.location.href = 'estante.html';
        else alert('Erro ao salvar o livro.');
    });

    carregarCategorias();
</script>

</body>
</html>
